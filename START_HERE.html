/* Public commander labels stay attached to each planet, with scroll space on mobile. */
.system-orbits-scroll{overflow-x:auto;border-radius:14px;margin:20px 0;overscroll-behavior-x:contain}
.system-orbits-scroll:focus-visible{outline:2px solid #55d9e9;outline-offset:3px}
.system-orbits-scroll .system-orbits{min-width:760px;height:360px;margin:0}
.system-orbits .orbit-target{width:44px;height:44px;min-width:44px;min-height:44px;overflow:visible}
.orbit-target .orbit-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:2px;width:100px;line-height:1.25;text-align:center;pointer-events:none;color:#dbe8f1;text-shadow:0 1px 3px #000}
.orbit-target.label-above .orbit-label{top:auto;bottom:100%}
.orbit-label>span{font-size:10px;white-space:nowrap}
.orbit-commander{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600;padding:3px 5px;background:#071824e8;border:1px solid #42566a;border-radius:5px}
.orbit-mine .orbit-commander{color:#55d9e9;border-color:#277786}
.orbit-foreign .orbit-commander{color:#f1c77d;border-color:#856c43}
.orbit-reserved .orbit-commander{border-style:dashed}

.orbit-target.label-right .orbit-label{top:50%;bottom:auto;left:100%;transform:translateY(-50%);margin-left:6px;text-align:left}

/* Shared transparent artwork for construction and research, sized for readable silhouettes. */
.item-icon.asset-item{width:88px;height:88px;padding:4px;border-color:#304b60;background:radial-gradient(at top left,#1c384c,#071521);overflow:hidden}
.asset-item img{display:block;width:100%;height:100%;object-fit:contain}
@media(max-width:760px){.item-icon.asset-item{width:64px;height:64px;padding:3px}.build-row:has(.asset-item) .item-copy{width:calc(100% - 77px)}}

/* Reports 2026: readable, touch-first journal cards; keep the existing desktop details. */
.fleet-navigation[data-active-section="reports"]{position:relative;top:auto;z-index:1}
#fleet-pane-reports,#fleet-pane-reports .panel,#report-list{min-width:0}
#fleet-pane-reports .page-heading{padding-top:2px}
#fleet-pane-reports .page-heading h1{margin-bottom:5px}
#fleet-pane-reports .page-heading p{max-width:52ch}
.report-tabs{gap:8px;margin-bottom:16px}
.report-tabs button{flex:1;min-width:0;background:#0b2737;border:1px solid #315367;color:#bfd8e7;box-shadow:none;border-radius:10px;font-size:13px;min-height:46px}
.report-tabs button[aria-selected=true]{background:linear-gradient(145deg,#126078,#103b52);color:#e7fbff;border-color:#36c8df;box-shadow:inset 0 -3px #42d7e9}
.report-filters{gap:10px}
.report-filters button{min-height:44px}
.report-toolbar{border-top:1px solid #244356;border-bottom:1px solid #244356;margin:18px 0 20px;padding:12px 0;gap:9px}
.report-toolbar>span{color:#b4cad7;font-weight:600;font-size:12px}
.report-toolbar button{min-height:42px;background:#102d3f;border-color:#315870;color:#bce9f3;box-shadow:none;font-size:12px}
.report-toolbar button[data-action="report-archive"]:not(:disabled){color:#e0fbff;border-color:#3caabf}
.report-toolbar button:disabled{opacity:.52}
.report-day{display:flex;align-items:center;gap:14px;margin:24px 0 12px;color:#9fbdd0;font-weight:700;font-size:12px;letter-spacing:.08em}
.report-day:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,#36566a,transparent)}
.report-list-row{--report-accent:#83b8cc;--report-glow:#1e5b6b2c;align-items:flex-start;min-width:0;margin:9px 0;overflow:hidden;border:1px solid #2b4c60;border-left:3px solid var(--report-accent);border-radius:12px;background:linear-gradient(115deg,var(--report-glow),transparent 52%),linear-gradient(145deg,#0e2939,#081b29);box-shadow:0 6px 20px #00000018;transition:border-color .16s,background .16s}
.report-kind-battle{--report-accent:#e7b16e;--report-glow:#8c532e24}
.report-kind-attack{--report-accent:#e98f82;--report-glow:#7a313529}
.report-kind-return{--report-accent:#82d3ad;--report-glow:#286e5526}
.report-kind-transport{--report-accent:#5acbdf;--report-glow:#126a8b26}
.report-kind-scan{--report-accent:#a3a6ed;--report-glow:#5556a026}
.report-kind-colony{--report-accent:#e3c67c;--report-glow:#7e672b25}
.report-list-row:has(>details[open]){border-color:#477990;border-left-color:var(--report-accent);background:linear-gradient(145deg,#123247,#091b2b)}
.report-list-row>input.report-select[type="checkbox"]{display:block;flex:0 0 18px;inline-size:18px;min-width:18px;max-width:18px;block-size:18px;min-height:18px;max-height:18px;padding:0;margin:22px 0 0 12px;accent-color:#39d1e8;appearance:auto;cursor:pointer}
.report-list-row>details{flex:1;min-width:0;max-width:100%}
.report-list-row>details>summary{display:grid;grid-template-columns:42px minmax(0,1fr) max-content max-content 28px;grid-template-areas:"symbol copy when badge chevron";align-items:center;gap:13px;padding:14px 16px;min-width:0;min-height:76px;list-style:none;cursor:pointer}
.report-list-row>details>summary::-webkit-details-marker{display:none}
.report-list-row>details>summary:focus-visible{outline:2px solid #76e3f2;outline-offset:-4px;border-radius:9px}
.report-row-symbol{grid-area:symbol;width:42px;height:42px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--report-accent) 38%,#284659);border-radius:11px;color:var(--report-accent);background:#071925}
.report-row-symbol svg{display:block;width:23px;height:23px}
.report-row-copy{grid-area:copy;min-width:0;gap:6px}
.report-row-copy strong{color:#edf8ff;font-size:14px;line-height:1.35;letter-spacing:.005em;overflow-wrap:anywhere}
.report-row-copy small{color:#a2bdce;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.report-list-row>details>summary time{grid-area:when;white-space:nowrap;font-size:12px;color:#9cbacd;font-variant-numeric:tabular-nums}
.report-date-short{display:none}
.report-badge{grid-area:badge;justify-self:end;max-width:100%;padding:5px 9px;border:1px solid #385970;background:#102c3b;color:#c0dded;border-radius:8px;font-size:11px;line-height:1.2;font-weight:700;white-space:normal;text-align:center}
.report-chevron{grid-area:chevron;display:grid;place-items:center;justify-self:end;width:28px;height:28px;border:1px solid #2a4b5f;background:#102a3a;border-radius:8px;color:#7bd5e5;font-size:19px;line-height:1}
.report-list-row>details[open]>summary{background:#123245;box-shadow:inset 0 -1px #315368}
.report-list-row>details[open]>summary .report-chevron{transform:rotate(180deg);background:#19465a;border-color:#36869b}
.report-detail{padding:16px 20px 20px;border-top:1px solid #31536a;min-width:0}
.report-detail p{color:#bfd1de;line-height:1.65;overflow-wrap:anywhere}
.report-metrics{gap:9px}
.report-metrics>div{padding:12px;border:1px solid #2a4d63;border-radius:10px;background:#0b2333;min-width:0}
.report-metrics small{font-size:11px;line-height:1.45}
.report-metrics strong{font-size:15px}
.report-force-table{max-width:100%;border:1px solid #2a4a5e;border-radius:10px;padding:0 10px 7px;scrollbar-width:thin}
.report-force-table caption{padding:12px 0}
.report-detail button[data-action="battle-log"]{max-width:100%;white-space:normal;text-align:center}
@media(max-width:760px){
 #fleet-pane-reports .panel{padding:13px}
 #fleet-pane-reports .page-heading h1{font-size:26px}
 .report-filters{grid-template-columns:repeat(2,minmax(0,1fr))}
 .report-toolbar{margin:12px 0 17px}
 .report-toolbar>span{flex-basis:100%;margin:0}
 .report-toolbar button{flex:1;min-width:0}
 .report-day{margin:22px 1px 11px}
 .report-list-row{margin:8px 0;border-radius:11px}
 .report-list-row>input.report-select[type="checkbox"]{margin:18px 0 0 10px}
 .report-list-row>details>summary{grid-template-columns:36px minmax(0,1fr) max-content 20px;grid-template-areas:"symbol copy copy chevron" "symbol when badge chevron";gap:6px 9px;padding:12px 11px;min-height:86px}
 .report-row-symbol{width:36px;height:36px;border-radius:9px}
 .report-row-symbol svg{width:20px;height:20px}
 .report-row-copy{gap:3px}
 .report-row-copy strong{font-size:13.5px}
 .report-row-copy small{font-size:11px;line-height:1.4}
 .report-list-row>details>summary time{font-size:11px}
 .report-date-full{display:none}
 .report-date-short{display:inline}
 .report-badge{padding:4px 7px;font-size:10px}
 .report-chevron{width:20px;height:25px;font-size:17px;border:0;background:transparent}
 .report-detail{padding:14px 12px 16px}
 .report-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .report-metrics>div:last-child:nth-child(odd){grid-column:1/-1}
 .report-participants section{padding:12px}
 .report-force-table{padding:0 8px 6px}
 .report-force-table table{min-width:390px}
 .report-detail button[data-action="battle-log"]{width:100%;min-height:46px}
}
@media(max-width:380px){
 #fleet-pane-reports .panel{padding:10px}
 .report-list-row>details>summary{grid-template-columns:32px minmax(0,1fr) max-content 16px;gap:5px 6px;padding:11px 7px}
 .report-list-row>input.report-select[type="checkbox"]{margin-left:7px}
 .report-row-symbol{width:32px;height:32px}
 .report-row-copy strong{font-size:12.5px}
 .report-badge{font-size:9px;padding:4px 5px}

function planetImagePath(p){
 const families={home:'continental',ferrum:'rock',nereus:'ice',thalassa:'ocean'};

// Passive views need fewer authoritative world writes. Events are caught up
// at their exact timestamps by advanceWorld() when the next sync runs.
const NORMAL_SYNC_MS = 30_000;

function shouldSyncCloud({now,lastAttempt=0,hidden=false,authoritative=false,dirty=false,pvp=null}){
 if(!authoritative&&!dirty)return false;
 // The server's authoritative world is advanced on the next foreground sync.
 // Legacy cloud saves must still be allowed while a tab is in the background.

  (Array.isArray(pvp?.outgoing)&&pvp.outgoing.length>0) ||
  (Array.isArray(pvp?.incoming)&&pvp.incoming.length>0)

}

// Read every page before aggregating. Never infer outcomes from a partial page.
async function loadBattleRound(read,mission,round){
 const first=await read(mission,round,0),shots=[...first.shots],impacts=[...first.impacts];
 const total=Math.max(first.shotTotal,first.impactTotal),limit=first.limit||200;
 for(let offset=limit;offset<total;offset+=limit){const page=await read(mission,round,offset);shots.push(...page.shots);impacts.push(...page.impacts);}
 if(shots.length!==first.shotTotal||impacts.length!==first.impactTotal)throw Error('Die Runde konnte nicht vollständig geladen werden.');
 return {...first,shots,impacts};
}

function summarizeRound(header,page){
 const units=new Map(header.initial.map(u=>[u.id,u])),pairs=new Map(),contributors=new Map();
 for(const shot of page.shots){
  const shooter=units.get(shot.shooter),target=units.get(shot.target);
  if(!shooter||!target)throw Error('Einheit im Kampfprotokoll fehlt.');
  const key=JSON.stringify([shooter.side,shooter.key,target.side,target.key]);
  if(!pairs.has(key))pairs.set(key,{shooter,target,shots:0,damage:0});
  const pair=pairs.get(key);pair.shots++;pair.damage+=shot.damage;
  if(!contributors.has(shot.target))contributors.set(shot.target,new Map());
  contributors.get(shot.target).set(shooter.key,shooter.name);
 }
 const outcomes=new Map();
 for(const hit of page.impacts){
  const target=units.get(hit.target),sources=[...(contributors.get(hit.target)||new Map())].sort(([a],[b])=>a.localeCompare(b));
  if(!target||!sources.length)throw Error('Treffer im Kampfprotokoll nicht zuordenbar.');
  const key=JSON.stringify([target.side,target.key,sources.map(([key])=>key)]);
  if(!outcomes.has(key))outcomes.set(key,{target,sources:sources.map(([,name])=>name),shield:0,hull:0,overkill:0,destroyed:0,surviving:0,hpAfter:0});
  const row=outcomes.get(key);row.shield+=hit.shieldDamage;row.hull+=hit.hullDamage;row.overkill+=hit.overkill;
  row.destroyed+=Number(hit.destroyed);row.surviving+=Number(!hit.destroyed);row.hpAfter+=hit.hpAfter;
 }
 return {pairs:[...pairs.values()],outcomes:[...outcomes.values()]};
}

function attackProgress(m,now){

}

function attackDistance(m,state,galaxy){
 const from=state.planets.find(p=>p.id===m.from),target=galaxy?.planets?.find(p=>p.id===m.to),system=galaxy?.systems?.find(s=>s.id===target?.system),origin=from?.system?from:state.galaxy||galaxy?.start;

   '💎 Nehmt Frachter mit: Beute braucht Laderaum. Übrige Depotbeute könnt ihr nach einem Sieg bis zur Stationserneuerung separat abholen. Trümmer lassen sich auch während der Abklingzeit bergen; ihre Ablaufzeit steht beim Ziel.',
   '🎨 Jede Stufe zeigt Melis Piratenbande im eigenen Bild. Animierte Flugrouten direkt bei den Stationen zeigen Hinflug, Rückflug und Ladung.',
   '💬 Viel Spaß bei euren ersten Raubzügen! Feedback und Auffälligkeiten gerne im Chat oder in der Wünschebox. ❤️'
  ]
 },
 {

  status:'⚖️ Kampfengine v6 · Balancing',

 {
  date:'17.10.2026',
  title:'🛰️ Orbitaler Erstschlag: Rapid Fire jetzt ab Runde 0! ⚡',
  status:'⚔️ Kampfsystem v6 · Feinschliff',
  items:[
   '🛡️ Flak, Laser, Railgun und Plasma können ihre Rapid-Fire-Zusatzsalven jetzt bereits beim orbitalen Erstschlag in Runde 0 auslösen – mit denselben Wahrscheinlichkeiten und maximal drei Extrasalven wie in den weiteren Runden.',
   '🎯 Die angreifende Flotte schießt in Runde 0 weiterhin nicht zurück. Für v6 gelten dabei keine alten pauschalen Schadensboni mehr.',
   '⚖️ Grundwerte für Angriff, Schild, Hülle sowie Baukosten bleiben unverändert. Bereits gestartete Angriffe behalten ihre beim Start festgelegten Kampfregeln.',
   '💬 Wir vergleichen als Nächstes die Balance von Flotten und Orbitalverteidigung. Feedback und ungewöhnliche Kampfergebnisse gerne im Chat oder in der Wünschebox! ❤️'
  ]
 },
 {
  date:'17.10.2026',
  title:'⚔️ Neue Kampfregeln: Zielbindung & Rapid Fire! 🚀',
  status:'🔥 Kampfengine v5 & v6 · v6 jetzt aktiv',
  items:[
   '🎯 Mit v5 kam die Zielbindung: Die regulären Schüsse eines Schiffs konzentrieren sich auf ein gemeinsames Ziel, statt sich auf mehrere Gegner zu verteilen.',
   '🔥 Jetzt ist v6 aktiv! Mit Rapid Fire haben bestimmte Schiffe und Orbitalgeschütze eine Chance auf zusätzliche volle Salven gegen passende Gegnertypen. Nach jeder Zusatzsalve entscheidet der Zufall erneut – maximal drei Zusatzsalven sind möglich.',
   '🚀 Jede Einheit soll eine eigene Aufgabe haben: Wächter sind besonders gut gegen Falken, Donner greifen Orbitalverteidigungen effektiv an, Titanen bekämpfen vor allem feindliche Flotten. Flak, Laser, Railgun und Plasma erhalten ebenfalls eigene Stärken.',
   '⚖️ Die früheren pauschalen Schadensboni gegen einzelne Gegnertypen entfallen in v6. Entscheidend sind jetzt eure Flottenzusammenstellung, die Grundkampfwerte und Rapid Fire.',
   '🛡️ Der orbitale Erstschlag bleibt bestehen – ab diesem Update können Orbitalgeschütze auch in dieser Eröffnungsrunde Rapid Fire auslösen. Schilde, Hüllenschäden, Reparaturen und Trümmer funktionieren weiterhin.',
   '⏳ Bereits gestartete Angriffe behalten ihre zugewiesene Kampfversion. Die neuen Regeln gelten für Angriffe, die mit v6 gestartet werden.',
   '💬 Eure Meinung zählt: v6 läuft aktuell, aber v5 bleibt als Rückfalloption verfügbar. Wenn ihr euch nach den ersten Kämpfen die Zielbindung ohne Rapid Fire zurückwünscht, sagt es uns im Chat oder über die Wünschebox!',
   '🐞 Bitte meldet auffällige Kampfergebnisse oder unerwartete Verluste. Wir schauen uns euer Feedback an und balancieren bei Bedarf nach. Viel Erfolg, Commander! ❤️'
  ]
 },
 {
  "date": "15.10.2026",
  "title": "🛠️ Orbitalgeschütze: ausgeschaltet heißt reparierbar! 🛡️",
  "status": "🛡️ Reparatur-Update #75",
  "items": [
    "💥 Flak, Laser, Railgun oder Plasma im Kampf ausgeschaltet? Ab jetzt bleiben eure Geschütze auf dem betroffenen Planeten als defekte Einheiten erhalten. Sie verteidigen erst wieder, wenn ihr sie repariert habt!",
    "🔧 So geht’s: Bei den defekten Geschützen im Orbit auf „Reparatur planen“ klicken oder das lokale Reparaturdock öffnen. Typ und Anzahl auswählen, Kosten prüfen und Auftrag starten. Auch die Orbitalwerft bietet euch den Reparaturweg direkt bei beschädigten Geschützen.",
    "💎 Die vollständige Wiederherstellung kostet 70 % der ursprünglichen Metall- und Kristall-Baukosten – keinen Treibstoff. Sie dauert genauso lange wie ein Neubau. Orbitalwerft und Arbeitsroboter beschleunigen beides; bei Energiemangel dauert es länger.",
    "☄️ 30 % Metall und Kristall landen als normale Trümmer im Orbit. Andere können sie mitnehmen – oder ihr selbst bergen. Eure Geschütze bleiben in beiden Fällen reparierbar. Bei vollständiger Eigenbergung bleiben 40 % Metall-/Kristallverlust.",
    "⏳ Defekte Geschütze bleiben auch während ihrer vollständigen Wiederherstellung inaktiv und geschützt. Sie kämpfen nicht und erzeugen bei weiteren Angriffen keine neuen Trümmer. Reparaturen laufen nacheinander; jede fertige Einheit ist sofort wieder einsatzbereit.",
    "🏆 Defekte Geschütze und laufende vollständige Wiederherstellungen bringen bis zur Fertigstellung keine Ranglistenpunkte. Danach zählen die Geschütze wieder zu den Gebäudepunkten.",
    "↩️ Reparatur abgebrochen? Nur unverbrauchtes Material kommt zurück. Noch nicht fertiggestellte Geschütze bleiben defekt; bereits verbrauchtes Material und begonnener Reparaturfortschritt gehen verloren.",
    "🚀 Überlebende Einheiten mit Teilschäden behalten die bisherige anteilige Reparatur und bleiben dabei angreifbar. Zerstörte Raumschiffe bleiben endgültig verloren. Die neue Geschützregel gilt für künftig abgewickelte Kämpfe; frühere Verluste werden nicht rückwirkend wiederhergestellt.",
    "🐞 Falls euch etwas auffällt, meldet es bitte über die Wünschebox oder im Chat. Viel Spaß beim Schrauben, Commander! ❤️"
  ]
},
 {date:'14.10.2026',title:'🏗️ Gebäude rückbauen! 🔻',status:'🏗️ Gebäuderückbau #69',items:[
 '🔻 Ab sofort kannst du Gebäudestufen einzeln zurückbauen – mit Bestätigungsfenster, 20 % Material zurück und 25 % der ursprünglichen Bauzeit! 💰⏳',
 '⚡ Die Auswirkungen auf deine Energieversorgung siehst du vor dem Rückbau.',
 '🐞 Fällt euch etwas auf? Bitte in der Wünschebox oder im Chat melden! ❤️'
 ]},
 {date:'14.10.2026',title:'⚙️ Weniger Serverlast, gleiche Raumschlachten! 🚀',status:'🛠️ Performance-Update #68',items:[
 '🚀 Der Serverabgleich wurde optimiert: weniger unnötige Anfragen und Datenbank-Updates.',
 '⚔️ Aktive Angriffe bleiben aktuell. Kampfregeln, Flugzeiten und Beute sind unverändert.',
 '🐞 Falls euch etwas auffällt, meldet es bitte über die Wünschebox oder im Chat. Danke! ❤️'
 ]},
 {date:'14.10.2026',title:'🛠️ Überlebt heißt nicht unbeschädigt – das Reparaturdock ist da!',status:'🚀 Reparatur-Update #66',items:[
 '🔍 Deine Titanen sind vom Kampf zurück, aber ihre Hülle hat ordentlich gelitten? Das erkennst du jetzt direkt im Hangar! Pro Schiffstyp und Planet siehst du intakte und beschädigte Einheiten, die gesamte verbleibende Hülle und den durchschnittlichen Hüllenzustand der beschädigten Einheiten.',
 '🏗️ Neues Gebäude: Reparaturdock! Baubar mit Schiffswerft Stufe 2 und Bautechnik Stufe 1. Über Hangar → Reparaturdock oder direkt bei deinen beschädigten Schiffen planst du die Reparatur.',
 '💰 Kosten und Dauer siehst du vor dem Start. Reparaturen kosten 30 % der Metall- und Kristall-Baukosten, anteilig zum Schaden. Ein Titan mit 50 % Hülle kostet damit 1.425 Metall und 975 Kristall.',
 '⏳ Reparieren braucht jetzt Zeit. Bei Dockstufe 1 und voller Energie dauert die Reparatur eines Titanen mit 50 % Hülle drei Minuten. Die am schwersten beschädigten Einheiten werden zuerst repariert.',
 '⚙️ Das Dock arbeitet unabhängig vom Schiffbau und besitzt eine eigene Warteschlange. Fertige Einheiten werden einzeln wieder freigegeben. Jede weitere Dockstufe verkürzt neue Reparaturen um 8 %; Strommangel bremst die Arbeit.',
 '⚠️ Das Dock ist kein Schutzbunker! Schiffe im Dock können keine Flüge starten, bleiben aber angreifbar und verteidigen mit ihrer aktuellen Hülle. Zusätzlicher Kampfschaden kann weiteres Reparaturmaterial erfordern.',
 '🏆 Schiffe im Dock zählen weiterhin in der Rangliste. Zerstörte Einheiten werden auch aus dem Reparaturauftrag entfernt.',
 '↩️ Aufträge lassen sich abbrechen. Ungenutztes Material wird erstattet, bereits reparierte Hülle bleibt erhalten.',
 '🚀 Die Kampfwerte bleiben unverändert. Bevor ihr die nächste Flotte losschickt: lieber einmal unter die Motorhaube schauen!'
 ]},
 {date:'14.10.2026',title:'🛡️💥 ORBITALE VERTEIDIGUNG SCHLÄGT ZUERST ZU!',status:'🛡️ Kampf-Update #62',items:[
 '🚀 Kampfsystem v3 – Runde 0 ist da! Stationäre Orbitalplattformen eröffnen ab sofort das Feuer, bevor die eigentliche Raumschlacht beginnt! 🔥',
 '🛰️ Runde 0: Verteidigende Orbitalplattformen feuern ihren ersten Angriff ab – die angreifende Flotte kann in dieser Runde noch nicht zurückschießen!',
 '⚔️ Runden 1–6: Danach läuft die reguläre Raumschlacht wie gewohnt weiter.',
 '🌍 Keine Orbitalplattformen? Dann beginnt der Kampf ganz normal mit Runde 1.',
 '📜 Neue Kampfberichte: Der orbitale Erstschlag wird als eigene Runde angezeigt und lässt sich im Kampfprotokoll nachvollziehen.',
 '🛠️ Bereits gestartete Kämpfe behalten ihre bisherigen Regeln.',
 '💀 Angreifer, aufgepasst: Wer einen schwer befestigten Planeten angreift, muss jetzt schon vor dem ersten eigenen Schuss mit Verlusten rechnen!',
 '🏗️ Verteidiger: Eure Orbitalplattformen sind jetzt eine echte erste Verteidigungslinie.',
 '🌌 Das Universum wird gefährlicher. Baut eure Verteidigung aus – oder bringt genügend Feuerkraft mit! 😈🚀'
 ]},
 {date:'13.10.2026',title:'🛡️ Orbitalverteidigung ist zurück! Vier Plattformen, eine eigene Werft 🚀',status:'🛠️ Orbital-Update',items:[
 '🎉 Kommandanten, die Orbitalwerft hat ihre Tore geöffnet! Ab sofort könnt ihr wieder stationäre Verteidigung bauen: 💥 Flakplattform, 🔴 Laserplattform, ⚙️ Railgunplattform und 💜 Plasmaplattform.',
 '🏗️ Eure Orbitalwerft produziert unabhängig von der normalen Schiffswerft. Jede Werftstufe bringt einen Auftragsplatz – bis zu 20 gleichzeitig vorgemerkte Bauaufträge. Auch größere Stückzahlen sind möglich!',
 '⚡ Achtet auf eure Energieversorgung: Bei Strommangel dauert der Bau länger. Höhere Orbitalwerft-Stufen verkürzen dagegen die Bauzeit. Und ja, die Werft verbraucht auch dann Energie, wenn sie gerade nichts baut! 😁',
 '🏆 Für die Rangliste zählen Orbitalplattformen jetzt zu den Gebäudepunkten, nicht zur Flotte. Die Orbitalwerft selbst bleibt ebenfalls ein Gebäude.',
 '📦 Die neuen Plattformen sind vollständige Einheiten samt Bewaffnung. Ihre Baukosten entsprechen jeweils den vergleichbaren Kriegsschiffen. Die alten Rohstofferstattungen und vorhandenen Werftstufen bleiben unberührt.',
 '⚔️ Noch feuern die Plattformen nach den bisherigen Kampfregeln. Ein eigener orbitaler Erstschlag in Runde 0 und das neue Reparatursystem folgen mit späteren Updates. More to come! 🌌💜'
 ]},
 {date:'13.10.2026',title:'☀️ Energie-Update: Volle Power für eure Kolonien! ⚡',status:'⚡ Energie-Balancing',items:[
 '🚀 Unsere Kraftwerke haben ein ordentliches Upgrade bekommen! Bisher stiegen die Baukosten mit jeder Stufe gewaltig, während die zusätzliche Energieproduktion gleich blieb. Das haben wir geändert!',
 '☀️ Solarkraftwerke produzieren mit höheren Ausbaustufen deutlich mehr Energie. 🌊 Gezeitenkraftwerke profitieren ebenfalls von der neuen Berechnung.',
 '🪐 Jeder Planetentyp besitzt jetzt eigene Effizienzfaktoren für die Kraftwerkstypen. Aktuell stehen diese Werte noch überall auf 1,25 – das wird sich ändern!',
 '🔋 Beispiel Solarkraftwerk Stufe 20: vorher 900 Energie, jetzt rund 1.903 Energie! Bestehende Kraftwerke profitieren automatisch, die Baukosten bleiben unverändert.',
 '⚠️ Ja, vermutlich habt ihr jetzt alle viel zu viel Energie. 😁 Genießt den Überschuss, solange er anhält! Wir werden die planetenspezifischen Faktoren weiter ausbalancieren.',
 '⛽ Ein weiterer Kraftwerkstyp ist bereits vorbereitet. More to come! 🚀💜'
 ]},
 {date:'13.10.2026',title:'Orbitalverteidigung im Umbau – Rohstoffe erstattet',status:'Orbital-Update',items:[
 'Die bisherigen Orbitalgeschütze (Flak, Laser, Railgun und Plasma) wurden vorübergehend aus dem Dienst genommen. Der Bau neuer Geschütze ist pausiert.',
 'Die investierten Rohstoffe wurden den betroffenen Kommandanten vollständig erstattet. Bestehende Ausbaustufen der Orbitalanlage bleiben erhalten.',
 'Wir bauen die Orbitalverteidigung als eigenständige Orbitalwerft mit neuen Plattformen wieder auf. Weitere Informationen folgen mit den nächsten Updates.'
 ]},
 {date:'13.10.2026',title:'Berichte jetzt auch mobil übersichtlich',status:'Berichte-Update',items:[
 'Neue kompakte Berichtskarten mit Icons, klaren Ergebnissen und besser lesbaren Details – besonders auf dem Smartphone.',
 'Auswahl, Archiv und Kampfprotokolle bleiben erreichbar. Der Darstellungsfehler mit den riesigen leeren Karten wurde behoben.'
 ]},
 {date:'12.10.2026',title:'Längere Flugzeiten in der Galaxie',status:'Flugzeiten',items:[
 'Flüge innerhalb der gemeinsamen Galaxie dauern ab sofort dreimal so lange. Die Flugzeiten deiner Tutorial-Planeten bleiben unverändert.',
 'Bereits gestartete Flüge behalten ihre bisherigen Ankunftszeiten.'
 ]},
 {date:'11.10.2026',title:'Neue Reise durch die Galaxie',status:'Galaxie-Update',items:['Die Desktop-Galaxie zeigt einen neuen Spiralgalaxie-Hintergrund mit anklickbaren Systemen. Die Systemansicht verbindet große Planeten und Umlaufbahnen mit den vorhandenen Flugaktionen.','Mobil bleibt das Galaxiebild ruhig: Große Systemkarten führen zu Planetenkarten. Details und Flugmöglichkeiten öffnen sich erst nach der Planetenauswahl.','Unbekannte Planeten bleiben verborgen. Besiedlung, Reservierungen und Flugwerte stammen weiterhin vom Server; private Spieler-Systeme sind platzsparend aufklappbar.']},
 {date:'11.10.2026',title:'Deine Werft baut weiter',status:'Werft-Update',items:[
 'Deine Werft erhält einen Auftragsplatz je Werftstufe, maximal 20 einschließlich des laufenden Auftrags. Bereits bezahlte Aufträge aus der bisherigen Warteschlange bleiben erhalten.',
 'Schiffs- und Verteidigungsaufträge lassen sich in eine planetare Warteschlange einreihen. Nach jedem fertigen Bauauftrag startet der nächste automatisch – auch während deiner Abwesenheit.',
 'Die Bauwarteschlange zeigt den laufenden Auftrag, Fortschritt, Restzeit und die nächsten Starts bei aktueller Energieversorgung. Die kompakten Schiffszeilen behalten ihre Mengenwahl, Kosten und Details.',
 'Rohstoffe werden beim Einreihen bezahlt. Abbrechen oder Entfernen erstattet die jeweilige Zahlung; Überschüsse bleiben im Lieferdepot. Wartende Verteidigungen reservieren bereits ihre Orbitalplätze.'
 ]},
 {date:'11.10.2026',title:'Ein Treffpunkt für alle Commander',status:'Community',items:[
 'Chat und Wünsche sind oben neben den News erreichbar. Der Universum-Chat verbindet alle angemeldeten Commander und aktualisiert sich automatisch, solange sein Fenster geöffnet ist.',
 'Im Wünsche-Bereich kannst du Ideen veröffentlichen und andere Vorschläge unterstützen. Admins können Wünsche als offen, geplant oder umgesetzt markieren.',
 'Beiträge werden gemeinsam auf dem Server gespeichert. Eigene Beiträge lassen sich ausblenden; Entwürfe bleiben bei einem Sendeproblem im geöffneten Fenster erhalten.'
 ]},
 {date:'11.10.2026',title:'Partnerflotten von deiner Heimatwelt',status:'Partner-Update',items:[
 'Lieferungen, Verteidigungsflotten und direkte Tauschgeschäfte können von jedem eigenen Planeten starten – auch von Heimatwelt und Tutorialkolonien. Partnerziele bleiben freigegebene Kolonien in der gemeinsamen Galaxie.',
 'Rückruf und Rückflug führen zum ursprünglichen Startplaneten. Es gelten weiterhin die passenden Galaxieantriebe, Flugzeiten und Treibstoffkosten; volle Heimatlager lassen Restladung an Bord.',
 'Kompakte Partnerkarten zeigen deine Liefer- und Verteidigungsrechte. Eigene Freigaben lassen sich mit Schaltern aufklappen und speichern; Einladungen und zusätzliche Aufträge benötigen weniger Platz.'
 ]},
 {date:'11.10.2026',title:'Kürzere Wege durch deine Flotte',status:'Navigation 0.5.4',items:[
 'Mobil führen drei Symbolflächen zu deinen Flottenbereichen: Hangar mit Übersicht und Werft, PvP mit Angriff, Verteidigung und Partnern sowie Handel mit Aufträgen, Routen und Berichten.',
 'Die Unterpunkte erscheinen direkt unter der gewählten Gruppe. Beim Wechsel merkt sich jede Gruppe ihre zuletzt geöffnete Ansicht während der Sitzung.',
 'Auch am Desktop führen die drei Gruppen Hangar, PvP und Handel direkt zu ihren Unterpunkten – ohne Mehr-Dropdown. Flotten öffnen zunächst die Gesamtübersicht; Werftwerte erscheinen nur noch in der Werft.',
 'Angriffswarnungen bleiben in allen Bereichen sichtbar und führen direkt zur Verteidigung. Kampfberichte sind weiterhin aus den Einsatzansichten erreichbar.'
 ]},
 {date:'11.10.2026',title:'Restladung bleibt im Frachter',status:'Transport-Update',items:[
 'Lieferungen laden nur bis zur Lagergrenze ab. Nicht abladbare Ressourcen kehren im Frachter zum Startplaneten zurück.',
 'Handelsrouten nehmen Restladung zum nächsten Stopp mit. Sie belegt Laderaum und begrenzt das weitere Beladen.',
 'Ist beim endgültigen Abladen auch das Startlager voll, warten Flotte und Restladung dort gebunden auf Platz. Das gilt auch für Abholflüge und heimkehrende Angriffsflotten.',
 'Partnerlieferungen behalten ebenfalls Restladung. Ein direkter Tausch wartet am Partnerlager auf vollständiges Abladen, bevor die reservierte Gegenleistung zurückfliegt.',
 'Bestehende Depotbestände und Baukostenerstattungen bleiben erhalten; neue Flottenlieferungen erzeugen kein Lieferdepot mehr.'
 ]},
 {date:'11.10.2026',title:'Deine gesamte Flotte im Überblick',status:'Flottenübersicht 0.5.3',items:[
 'Die Gesamtübersicht lässt sich zwischen Nach Schiff und Nach Planet umschalten. So siehst du die Orbitbestände aller eigenen Planeten und wo deine Schiffe liegen.',
 'Kategorien für Transport, Kampf, Sonden & Kolonie und Verteidigung helfen beim Filtern. Am Desktop stehen die Karten nebeneinander, mobil lassen sich ihre Details aufklappen.',
 'Unterwegs nutzt das vertraute Handelsrouten-Design mit passenden Informationen zum jeweiligen Auftrag. Handelsrouten lassen sich auch hier bearbeiten, pausieren und beenden.',
 'Galaxieflüge, eigene Angriffe und Partnerflotten sind ebenfalls sichtbar. Fliegende und beim Partner stationierte Schiffe werden getrennt vom Orbitbestand deiner Planeten angezeigt.'
 ]},
 {date:'11.10.2026',title:'Kompakte Werft mit direktem Schiffbau',status:'Werft-Update 0.5.2',items:[
 'Bild, Schiffname, Ressourcen als Symbol und Menge, Bauzeit, Mengenwahl und Bauen bleiben auch eingeklappt sichtbar – mobil und am Desktop.',
 'Beschreibung, Laderaum, Tempo, Verbrauch und Voraussetzungen lassen sich je Schiff aufklappen.',
 'Kosten und Bauzeit reagieren auf die gewählte Anzahl. Die Ressourcen- und Orbitalplatzprüfung berücksichtigt die gesamte Bestellung.'
 ]},
 {date:'11.10.2026',title:'Flottenversand bei unterschiedlichen Serverständen',status:'Korrektur 0.5.1',items:[
 'Liefern, Abholen und Stationieren mit einem Schiffstyp senden wieder beide unterstützten Anfrageformate. Damit funktionieren diese Aufträge auch während eines noch ausstehenden Backend-Updates.',
 'Gemischte Flotten prüfen vor dem Versand die Serverunterstützung. Ein veralteter Server führt zu einem klaren Hinweis statt einer irreführenden Schiffsfehlermeldung.',
 'Übersteigt eine gespeicherte Auswahl den aktuellen Schiffsbestand, zeigt das Formular gewählte und verfügbare Anzahl an.'
 ]},
 {date:'11.10.2026',title:'Dein Imperium auf einen Blick',status:'Übersicht-Update 0.5',items:[
 'Kompakte Übersicht für Browser und Mobilgerät: kleinere Planetenansicht und aufgeräumte Bauaufträge mit aufklappbaren Details.',
 'Produktion pro Stunde zwischen dem gesamten Imperium und der aktiven Welt umschalten. Die tatsächliche Förderleistung berücksichtigt planetare Faktoren und Strommangel.',
 'Jede Planetenkarte zeigt Produktion, Rohstoff- und Energiefaktoren, die drei Förderstufen sowie die Werftstufe.',
 'Ein abgeschlossenes Tutorial lässt sich ausblenden und über Spielstand & Hilfe wieder anzeigen. Die Anzeigeeinstellung wird je Spielstand und Konto in diesem Browser gespeichert.'
 ]},
 {date:'11.10.2026',title:'Flottenplanung, Routenpause und Forschung',status:'Flotten-Update 0.4',items:[
 'Einheitliche Schiffsauswahl für Angriffe, Transporte, Partnerflotten und Handelsrouten: ausgewählt / verfügbar, grüne Bestandszahl und Alle-Schaltfläche.',
 'Rohstoffmengen beginnen bei 0. Schnellwahl: 0, +5 % des ausgewählten Flottenladeraums und MAX.',
 'Handelsrouten: Entladen, Beladen oder beides am selben Stopp. Eine Pause greift nach der Runde am Startplaneten; die Schiffe bleiben gebunden. Fortsetzen und Bearbeiten bleiben möglich.',
 'Partner direkt aus der Galaxiekarte beliefern oder verteidigen. Handelsrouten bleiben ausschließlich zwischen eigenen Planeten.',
 'Militärtechnik bis Stufe 10: ein Angriffsplatz ab Stufe 1, zwei ab Stufe 5, vier ab Stufe 10. Hin- und Rückflug belegen den Platz. Das bisherige Zweierlimit pro Gegner und Tag entfällt; das 24-Stunden-Beutebudget je Zielkolonie bleibt.',

function pvpEstimate(state,galaxy,to,fleet){
 const target=galaxy?.planets.find(p=>p.id===to),system=galaxy?.systems.find(s=>s.id===target?.system);
 if(!target||!system)throw Error('Ziel fehlt.');
 const f=attackFlight(state,state.planets.find(p=>p.id===state.active),{...system,system:target.system,slot:target.slot},fleet);
 return 'Hinflug: '+pvpDuration(f.ms)+' · Rückflug: '+pvpDuration(f.ms)+' · Treibstoff: '+f.fuel.toLocaleString('de-DE')+' (Hin- und Rückflug, beim Start fällig) · Langsamstes Schiff: '+SHIPS[f.slowest].name;
}

function pvpAttackPlan(state,pvp,galaxy,to,fleet,now,busy=false){
 const from=state.planets.find(p=>p.id===state.active),target=galaxy?.planets?.find(t=>t.id===to);
 const capacity=pvp?.attackCapacity??attackSlots(state.tech.military),pve=(pvp?.pirates?.missions||[]).filter(m=>m.kind==='attack').length,used=(pvp?.outgoing?.length||0)+pve;
 const protectedUntil=pvp?.colonies?.find(p=>p.id===to)?.protectedUntil||0;
 let reason=!pvp?.enabled?'PvP ist momentan pausiert.':busy?'Serverabgleich läuft …':!target||target.owner!=='foreign'||target.reserved?'Wähle eine fremde besiedelte Zielkolonie.':protectedUntil>now?'Das Ziel steht noch unter Gründungsschutz.':used>=capacity?'Alle Angriffsplätze sind belegt.':'';
 let flight=null,flightText='Wähle deine Flotte für die Flugvorschau.';
 try{
  for(const [key,n] of Object.entries(fleet))if(!['military','freighter'].includes(SHIPS[key]?.category)||!Number.isSafeInteger(n)||n<1||n>(from.ships[key]||0))throw Error('Nicht genügend verfügbare '+(SHIPS[key]?.name||'Schiffe')+'. Bitte die Auswahl anpassen.');
  flightText=pvpEstimate(state,galaxy,to,fleet);
  const system=galaxy.systems.find(s=>s.id===target.system);flight=attackFlight(state,from,{...system,system:target.system,slot:target.slot},fleet);
  if(flight.fuel>from.resources.fuel&&!reason)reason='Nicht genug Treibstoff für Hin- und Rückflug.';
 }catch(e){flightText=e.message;if(!reason)reason=e.message;}
 return {ready:!reason,reason,capacity,used,pve,protectedUntil,protected:protectedUntil>now,flight,flightText,from:from.name,to:target?('['+target.system+':'+target.slot+'] '+(target.surveyed?target.name:'Unbekannt')):'Ziel wählen'};
}

// Only available orbiting units belong here. Missions are displayed separately.
function fleetInventory(planets,category='all'){

  const locations=planets.filter(p=>orbitCondition(p,key).total>0).map(p=>({planet:p,count:orbitCondition(p,key).total}));
  return {key,ship,locations,total:locations.reduce((sum,p)=>sum+p.count,0)};
 }).filter(row=>row.total>0).sort((a,b)=>b.total-a.total||a.ship.name.localeCompare(b.ship.name,'de'));

function pirateConfig(input={}){

 const c=structuredClone(PIRATE_REALM_DEFAULTS),keys=Object.keys(c);

 for(const k of ['strengthFactor','resourceFactor','flightTimeFactor','fuelFactor'])if(!Number.isFinite(c[k])||c[k]<.1||c[k]>20)throw Error('Piratenfaktoren müssen zwischen 0,1 und 20 liegen.');
 for(const [k,min,max] of [['cooldownMinutes',1,1440],['debrisLifetimeHours',1,168],['maxMissions',1,50]])if(!Number.isSafeInteger(c[k])||c[k]<min||c[k]>max)throw Error('Ungültiger Piratenwert: '+k);

 if(input.stations!==undefined&&(!input.stations||typeof input.stations!=='object'||Array.isArray(input.stations)||Object.keys(input.stations).some(id=>!Object.hasOwn(c.stations,id))))throw Error('Unbekannte Piratenstation.');

  if(Object.keys(patch).some(k=>!['enabled','cooldownMinutes','sensor','fleet','resources','tech'].includes(k)))throw Error('Unbekannter Stationswert.');

  if(b.cooldownMinutes!==null&&(!Number.isSafeInteger(b.cooldownMinutes)||b.cooldownMinutes<1||b.cooldownMinutes>1440))throw Error('Ungültige Stations-Abklingzeit.');

  if(!b.resources||Object.keys(b.resources).some(k=>!RES.includes(k))||RES.some(k=>!Number.isSafeInteger(b.resources[k])||b.resources[k]<0||b.resources[k]>1e8))throw Error('Ungültiges Piratendepot.');

 }

}

// Lightweight unread counters. Stored per account and browser; no database migration.
const noticeKinds=['news','chat','wish','war'];
const noticeCounts={news:0,chat:0,wish:0,war:0};
let noticePolling=false,noticeAccount='';
const noticeKey=()=> 'wahuelapa-read-v1:'+String(cloud?.user?.id||'guest');
function noticeRead(){try{return JSON.parse(localStorage.getItem(noticeKey())||'{}')||{};}catch{return {};}}
function noticeSave(data){try{localStorage.setItem(noticeKey(),JSON.stringify(data));}catch{}}
function noticeBadge(kind){const count=noticeCounts[kind]||0;return count?'<span class="notice-count" aria-label="'+count+' ungelesen">'+(count>99?'99+':count)+'</span>':'';}
function noticePaint(){for(const kind of noticeKinds){const target=document.querySelector('[data-notice-kind="'+kind+'"]');if(!target||typeof target.querySelector!=='function')continue;target.querySelector('.notice-count')?.remove();if(noticeCounts[kind]&&typeof target.insertAdjacentHTML==='function')target.insertAdjacentHTML('beforeend',noticeBadge(kind));}}
function noticeMark(kind,ids){
 const data=noticeRead();if(!Array.isArray(ids))return;
 if(kind==='news'){data.news=ids;}
 else if(kind==='war'){data.war=ids.slice(0,100);}
 else {data[kind]=Math.max(Number(data[kind]||0),...ids.map(Number).filter(Number.isFinite),0);}
 noticeSave(data);noticeCounts[kind]=0;noticePaint();
}
function noticeRefreshNews(){
 const read=noticeRead(),ids=GAME_NEWS.map(n=>n.date+'|'+n.title);
 // A fresh account sees only the latest announcement, not the entire back catalogue.
 noticeCounts.news=Array.isArray(read.news)?ids.filter(id=>!read.news.includes(id)).length:Math.min(1,ids.length);
 noticePaint();
}
async function noticePoll(){
 if(noticePolling||!cloud?.user||document.hidden)return;
 const account=noticeKey();noticePolling=true;
 try{
  const data=noticeRead();
  const requests=[['chat',()=>cloud.community('chat')],['wish',()=>cloud.community('wish')],['war',()=>cloud.warTimes()]];
  await Promise.all(requests.map(async ([kind,load])=>{
   try{
    const result=await load();if(account!==noticeKey())return;
    const rows=kind==='war'?result:result.items;
    if(!Array.isArray(rows))return;
    const ids=rows.filter(x=>kind==='war'||!x.mine&&!x.deleted).map(x=>kind==='war'?String(x.id):Number(x.id));
    if(kind==='war'){
     if(!Array.isArray(data.war)){data.war=ids.slice(0,100);noticeSave(data);noticeCounts.war=0;}
     else noticeCounts.war=ids.filter(id=>!data.war.includes(id)).length;
    }else{
     const max=Math.max(0,...rows.map(x=>Number(x.id)||0));
     if(!Number.isFinite(Number(data[kind]))){data[kind]=max;noticeSave(data);noticeCounts[kind]=0;}
     else noticeCounts[kind]=ids.filter(id=>id>Number(data[kind])).length;
    }
   }catch{/* Keep the previous unread state during a network error. */}
  }));
  noticePaint();
 }finally{noticePolling=false;}
}
document.addEventListener('community-feed-loaded',e=>{
 const {kind,items}=e.detail||{};if(!['chat','wish'].includes(kind)||!Array.isArray(items))return;
 // The event only fires when the feed was successfully loaded inside its open dialog.
 const max=Math.max(0,...items.map(p=>Number(p.id)||0));
 noticeMark(kind,[max]);
});
setInterval(()=>{if(noticeAccount!==noticeKey()){noticeAccount=noticeKey();noticeCounts.chat=noticeCounts.wish=noticeCounts.war=0;noticeRefreshNews();}void noticePoll();},45000);

 else if(key==='solar'||key==='tidal'){current=now.supply;next=after.supply;unit='⚡';}
 else if(key==='warehouse'){current=now.cap;next=after.cap;unit='Lager';}

 const caption=RES.includes(key)?'Förderung':key==='warehouse'?'Lagerkapazität':'Energieproduktion';
 return `<div class="compact-production" aria-label="${caption}: ${compactNumber(current)} auf ${compactNumber(next)}"><span>${compactNumber(current)}</span><span class="compact-chev" aria-hidden="true">➜</span><strong>${compactNumber(next)}</strong><small>${unit}</small></div>`;

function buildingEnergy(p,key){

async function flushCloud(){
 if(readOnly||!cloud?.user||cloudBlocked||cloudSaving||!state)return false;
 cloudSaving=true;cloudLastAttempt=Date.now();let refreshView=false;
 const generation=cloudGeneration,snapshot=structuredClone(state);
 cloudMessage='Cloud wird gespeichert …';refreshCloudBadge();
 try{
  if(cloud.authoritative){
   const oldSeq=state.seq,oldPvP=JSON.stringify({...cloud.pvp,serverNow:0});
   adoptServer(await cloud.gameRequest({type:'sync'}));
   refreshView=oldSeq!==state.seq||oldPvP!==JSON.stringify({...cloud.pvp,serverNow:0});
   return true;
  }
  await cloud.save(snapshot);cloudDirty=cloudGeneration!==generation;cloudLastSave=Date.now();
  try{localStorage.setItem(saveKey()+'-cloud-meta',JSON.stringify({revision:cloud.revision,pending:cloudDirty}));}catch{}
  cloudMessage=`● Cloud gespeichert · ${new Date(cloudLastSave).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}`;
  return true;
 }catch(e){
  cloudMessage='⚠ Nur lokal gesichert · Cloud erneut versuchen';
  if(e instanceof CloudConflict){cloudBlocked=true;cloudMessage='⚠ Anderes Gerät gespeichert · Cloud neu laden';toast(e.message);settings();}
  else toast(e.message||'Cloud-Speicherung fehlgeschlagen. Lokale Sicherung bleibt erhalten.');
  return false;
 }finally{
  // Render the completed state only after releasing the request lock. A view
  // opened during the request also needs to release its disabled controls,
  // even if the snapshot did not change or the network request failed.
  cloudSaving=false;
  if(refreshView||cloudRenderPending){cloudRenderPending=false;render();}
  refreshCloudBadge();
  if(tab==='leaderboard')void refreshRanking();
  if(tab==='fleet'&&['reports','pvp','defense'].includes(fleetSection))void refreshReports();
  const status=document.getElementById('cloud-status');if(status)status.textContent=cloudMessage;
 }
}

function updateOverviewProgress(now){for(const el of document.querySelectorAll('[data-overview-start]')){const start=Number(el.dataset.overviewStart),end=Number(el.dataset.overviewEnd),percent=Math.round(Math.max(0,Math.min(100,100*(now-start)/Math.max(1,end-start))));el.setAttribute('aria-valuenow',percent);el.querySelector('i').style.width=percent+'%';}}

function fleetExternalMissions(){
 const now=gameNow(),social=cloud?.pvp?.social,flights=[];
 for(const m of cloud?.pvp?.outgoing||[]){const returning=m.status==='returning',due=returning?m.returnAt:m.arrival,start=returning?m.arrival:m.arrival-(m.returnAt-m.arrival);flights.push(fleetTravelCard({title:'Angriff',status:m.awaitingUnload?'Wartet auf Lagerplatz · Schiffe gebunden':returning?'Rückflug':'Unterwegs',worlds:(returning?[m.to,m.from]:[m.from,m.to]).map(fleetWorld),fleet:m.fleet,cargoHTML:costHTML(m.cargo||vector([0,0,0])),capacity:fleetCapacity(state,m.fleet),start,due,now,waiting:!!m.awaitingUnload,clock:m.awaitingUnload?'Restladung bleibt an Bord':duration(due-now),actions:button('Einsatz ansehen','pvp-open')}));}
 for(const m of social?.missions||[]){if(!m.own)continue;const returning=m.status==='returning',stationed=m.status==='stationed',actions=m.kind==='support'&&['outbound','stationed'].includes(m.status)?`<button data-social-op="recall" data-social-id="${esc(m.id)}" ${readOnly||galaxyBusy||cloudSaving?'disabled':''}>Zurückrufen</button>`:'';
 if(stationed){flights.push(`<article class="route-card"><div class="route-card-heading"><h3>Verteidigung bei ${esc(m.hostName)}</h3><span class="route-status">Stationiert</span></div><div class="route-path">${orb(fleetWorld(m.to),'small')} ${esc(fleetWorld(m.to).name)}</div><div class="route-ships">${Object.entries(m.fleet).filter(([,n])=>n>0).map(([k,n])=>`<span>${unitIcon(k)} ${fmt(n)} × ${esc(SHIPS[k]?.name||k)}</span>`).join('')}</div><div class="route-actions">${actions}</div></article>`);continue;}
 flights.push(fleetTravelCard({title:({delivery:'Partnerlieferung',trade:'Rohstofftausch',support:'Verteidigung'})[m.kind]||'Partnerflotte',status:m.awaitingUnload?'Wartet auf Lagerplatz · Schiffe gebunden':returning?'Rückflug':'Unterwegs',worlds:(returning?[m.to,m.from]:[m.from,m.to]).map(fleetWorld),fleet:m.fleet,cargoHTML:costHTML(m.cargo),capacity:fleetCapacity(state,m.fleet),info:'Partner: '+m.hostName,start:m.due-m.duration,due:m.due,now,waiting:!!m.awaitingUnload,clock:m.awaitingUnload?'Restladung bleibt an Bord':duration(m.due-now),actions}));}
 return flights.length?'<h3>Angriffe & Partnerflotten · '+flights.length+'</h3><div class="route-cards">'+flights.join('')+'</div>':'';
}

// Public war newspaper: isolated from personal combat reports.
document.addEventListener('click',async e=>{
 if(!e.target.closest('[data-action="war-times-open"]'))return;
 document.querySelector('dialog')?.remove();
 const d=document.createElement('dialog');d.className='news-dialog war-dialog';
 d.innerHTML='<form method="dialog"><button aria-label="Schließen">×</button></form><header class="war-masthead"><strong>GALAXY WAR TIMES</strong><small>Unabhängig. Unbestechlich. Unverschämt.</small></header><div class="war-paper" id="war-paper"><p>Die galaktische Redaktion recherchiert …</p></div>';
 document.body.append(d);d.addEventListener('close',()=>d.remove(),{once:true});d.showModal();
 try{if(!cloud?.user)throw Error('Das galaktische Kriegsarchiv ist für angemeldete Commander verfügbar.');const items=await cloud.warTimes();if(d.isConnected){d.querySelector('#war-paper').innerHTML=warTimesView(items);noticeMark('war',items.map(item=>String(item.id)));}}catch(err){if(d.isConnected)d.querySelector('#war-paper').textContent=String(err?.message||err);}
});

// Embedded newspaper renderer avoids an extra module fetch on GitHub Pages.
// Newspaper text is deterministic per battle: refreshing never changes a published story.
const headlines={

 ['Erst Kanonen, dann Einkaufswagen!','{a} gewann auf {p} gegen {d}. Nach dem Auftritt der {af} war von der {df} nicht mehr viel Widerstand zu erwarten.','Die örtliche Handelskammer nennt es einen sehr einseitigen Einkauf.'],
 ['Raubzug mit Abholgarantie!','Mit einer {af} machte {a} auf {p} bei {d} einen Abstecher. Die Verteidigung scheiterte, Rohstoffe wurden abtransportiert.','Der Eigentümer hat den Lieferschein bis heute nicht unterschrieben.'],
 ['Diebstahl? Nein, spontane Umverteilung!','{a} erschien mit einer {af} über {p}, besiegte {d} und transportierte Beute ab.','Das Finanzamt bittet um die korrekte Verbuchung des Überfalls.']
 ],
 empty:[
 ['Sieg errungen – Konto trotzdem leer!','{a} überwand mit einer {af} die Verteidigung von {d} auf {p}. Zum Mitnehmen gab es nichts.','Die Finanzabteilung beantragt eine vorherige Lagerkontrolle.'],
 ['Großangriff auf leere Regale!','Auf {p} setzte sich {a} mit einer {af} gegen {d} durch. Die Rohstoffsuche verlief deutlich weniger erfolgreich.','Die Expedition gilt jetzt als kostenpflichtige Besichtigung.'],
 ['Kanonen sprechen, Geldbeutel schweigt!','{a} siegte auf {p} gegen die Verteidigung von {d}. Der erhoffte Reichtum blieb aus.','Der zuständige Admiral verweist auf wertvolle Lebenserfahrung.'],
 ['Erfolgreich erobert: exakt gar nichts!','{a} schlug mit einer {af} die Verteidigung von {d} auf {p}. Beute blieb aus.','Ein Gutschein für den nächsten Überfall wurde abgelehnt.']
 ],
 defense:[
 ['Zutritt verweigert!','{a} erschien mit einer {af} über {p}. {d} begrüßte die Besucher mit einer {df} und schickte sie wieder weg.','Die Parkgebühren für feindliche Flotten wurden trotzdem berechnet.'],
 ['Großer Auftritt, kleiner Abgang!','{a} wollte mit einer {af} auf {p} Eindruck machen. {d} und die Verteidigung waren leider ein wenig schwer zu beeindrucken.','Offiziell heißt das jetzt strategische Umorientierung.'],
 ['Hier fliegt heute niemand durch!','{d} verteidigte {p} mit einer {df} gegen {a} und dessen {af}. Der Angriff scheiterte.','Die örtlichen Geschützmannschaften verlangen einen Feiertag.'],
 ['Invasion? Nicht mit uns!','{a} brachte eine {af} nach {p}. Dort hatte {d} schon seine {df} als Antwort vorbereitet.','Die diplomatischen Beziehungen gelten weiterhin als ausbaufähig.']
 ],
 wipe:[
 ['Rückflug ersatzlos gestrichen!','{a} schickte eine {af} gegen {d} auf {p}. Die {df} vernichtete alle Angreifer.','Die Fluggesellschaft bittet, von Rückerstattungsanfragen abzusehen.'],
 ['Vermisst wird eine komplette Flotte!','Auf {p} endete der Besuch von {a} bei {d} in einem Trümmerfeld. Kein Angriffsschiff überlebte.','Die Suchmeldung wurde direkt an den Schrotthändler weitergeleitet.'],
 ['Aus Raumschiffen wird Recyclingmaterial!','{d} empfing die {af} von {a} auf {p} mit einer {df}. Die Angreifer wurden vollständig zerstört.','Das Umweltamt prüft noch die Mülltrennung.'],
 ['Einbahnstraße nach {p}!','{a} wagte mit einer {af} einen Vorstoß gegen {d}. Die Verteidigung ließ niemanden zurückkehren.','Das Navi meldet: Ziel erreicht, Fahrzeug nicht gefunden.']
 ],
 draw:[
 ['Beide erklären sich zum Sieger!','{a} und {d} gerieten über {p} mit einer {af} und einer {df} aneinander. Niemand konnte sich durchsetzen.','Beide Presseabteilungen haben trotzdem schon Pokale bestellt.'],
 ['Viel Lärm, wenig Ergebnis!','Auf {p} traf die {af} von {a} auf die Verteidigung von {d}. Das Gefecht endete ohne Sieger.','Die Munitionshersteller melden einen erfolgreichen Geschäftstag.'],
 ['Patt im All!','{a} und {d} stritten auf {p} mit militärischen Argumenten. Eine Entscheidung fiel nicht.','Ein Schiedsrichter war leider nicht verfügbar.'],
 ['Galaktischer Streit endet mit Achselzucken!','{a} griff {d} auf {p} an. Beide Seiten schossen, doch niemand gewann.','Man einigte sich darauf, uneinig zu bleiben.']
 ]};
const hash=id=>[...String(id)].reduce((n,c)=>(Math.imul(n,31)+c.charCodeAt(0))>>>0,7);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function warArticle(item){
 const type=item.outcome==='attacker'?(item.loot?'loot':'empty'):item.outcome==='defender'?(item.wipe?'wipe':'defense'):'draw';
 const [headline,lead,punch]=headlines[type][hash(item.id)%4];
 const data={a:item.attacker,d:item.defender,p:item.planet,af:item.attackSize,df:item.defenseSize};
 const fill=s=>s.replace(/\{(a|d|p|af|df)\}/g,(_,key)=>escapeHtml(data[key]));
 return {type,title:fill(headline),body:fill(lead)+' '+fill(punch)};
}
function warTimesView(items){
 if(!items.length)return '<p class="war-empty">Noch keine veröffentlichten Schlachten. Die Redaktion wartet auf den ersten großen Knall.</p>';
 return items.map((item,i)=>{const a=warArticle(item),date=new Date(item.at).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'});return '<article class="war-story '+escapeHtml(a.type)+'">'+(i===0?'<span class="war-breaking">TOP-STORY</span>':'')+'<div class="war-date">'+escapeHtml(date)+'</div><h3>'+a.title+'</h3><p>'+a.body+'</p><div class="war-byline">GALAXY WAR TIMES · Garantiert unseriös</div></article>';}).join('');
}

function capturePirateDraft(form){const d=new FormData(form);pirateDraft={from:d.get('from'),op:d.get('op'),fleet:Object.fromEntries([...form.querySelectorAll('[data-fleet-ship]')].filter(i=>Number(i.value)>0).map(i=>[i.dataset.fleetShip,Number(i.value)]))};}
function updatePirateEstimate(){
 const form=document.getElementById('pirate-fleet-form'),output=document.getElementById('pirate-estimate');if(!form||!output||!cloud?.pvp?.pirates)return;
 updatePirateHangar(form,state);
 const d=new FormData(form),p=state.planets.find(p=>p.id===d.get('from')),q=cloud.pvp.pirates.stations.find(s=>s.id===form.dataset.station),fleet=Object.fromEntries([...form.querySelectorAll('[data-fleet-ship]')].filter(i=>Number(i.value)>0).map(i=>[i.dataset.fleetShip,Number(i.value)]));
 try{const estimate=pirateFlightEstimate(state,p,q,fleet,cloud.pvp.pirates.config);output.textContent=estimate.text+(p.resources.fuel<estimate.fuel?' · Treibstoff fehlt!':'');}catch(e){output.textContent=e.message;}
}
document.addEventListener('input',e=>{const form=e.target.closest('#pirate-fleet-form');if(form){capturePirateDraft(form);updatePirateEstimate();}if(e.target.closest('#pirate-config-form'))pirateConfigDraft=e.target.value;});
document.addEventListener('change',e=>{const form=e.target.closest('#pirate-fleet-form');if(!form)return;capturePirateDraft(form);if(e.target.name==='from'||e.target.name==='op'){pirateDraft.fleet={};render();}else updatePirateEstimate();});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled||!piratePreviewAllowed(cloud)||readOnly||cloudBlocked)return;
 const op=b.dataset.action;
 if(op==='pirate-refresh'){void flushCloud();return;}
 if(!['pirate-scan','pirate-build-probe'].includes(op))return;
 const form=document.getElementById('pirate-fleet-form');if(!form)return;const from=new FormData(form).get('from');
 if(op==='pirate-build-probe')void command({type:'ship',planet:from,key:'spyProbe',count:1});
 else void serverAction({type:'pirate',action:{op:'scan',from,station:form.dataset.station}});
});
document.addEventListener('submit',async e=>{
 if(!['pirate-fleet-form','pirate-config-form'].includes(e.target.id))return;e.preventDefault();
 if(!piratePreviewAllowed(cloud)||readOnly||cloudBlocked)return;
 const form=e.target,d=new FormData(form);
 if(form.id==='pirate-config-form'){if(cloud?.pvp?.isAdmin!==true)return;try{await serverAction({type:'pirate',action:{op:'configure',config:JSON.parse(d.get('config'))}});}catch(err){toast('Ungültiges JSON: '+err.message);}return;}
 const op=d.get('op');
 capturePirateDraft(form);await serverAction({type:'pirate',action:{op,station:form.dataset.station,from:d.get('from'),fleet:pirateDraft.fleet}});
});

document.addEventListener('click',e=>{

function refreshCargoHangars(root=document){
 if(!state)return;const blocked=readOnly||cloudBlocked||galaxyBusy||cloudSaving;
 for(const group of root.querySelectorAll('.cargo-hangar')){const form=group.closest('form');if(!form)continue;const cap=selectedCapacity(form),row=group.closest('.route-stop'),from=getPlanet(state,form.dataset.planet||state.active),type=form.elements.namedItem('type')?.value,collect=type==='collect',payment=group.querySelector('[data-cargo-number]')?.name.startsWith('payment-'),unload=group.querySelector('[data-cargo-number]')?.name.startsWith('unload-'),source=row?getPlanet(state,row.querySelector('[name=stop-planet]').value):collect?state.planets.find(q=>q.id===form.elements.namedItem('to')?.value):from;
 let fuel=0;try{const target=state.planets.find(q=>q.id===form.elements.namedItem('to')?.value)||socialFlightTargets(cloud?.pvp?.social,form.dataset.op).find(q=>q.id===form.elements.namedItem('to')?.value);if(target&&!row){const fleet=readMixedFleet(form);fuel=form.id==='social-flight-form'?Object.entries(fleet).reduce((n,[k,count])=>n+2*sharedFlight(state,from,target,count,k).fuel,0):fleetLegInfo(state,from,target,fleet).fuel*(type==='station'?1:2);}}catch{}
 const stock=payment||unload?null:Object.fromEntries(RES.map(k=>[k,Math.max(0,(source?.resources[k]||0)+(form.id==='social-flight-form'?0:source?.depot?.[k]||0)-(source?.reserves?.[k]||0)-(k==='fuel'&&!collect&&!row?fuel:0))]));updateCargoHangar(group,{capacity:cap,stock,blocked,future:!!row||collect||payment,unknownLabel:unload?'Ladung bei Ankunft':undefined});
 }
}
