name: Build lightweight ship icons
on:
  push:
    branches: [feature/ship-v3-lightweight-icons]
    paths:
      - 'scripts/generate_ship_icons.py'
      - 'src/ui-assets.js'
      - 'assets/ship-concept-v3/**'
      - '.github/workflows/ship-icons-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/generate_ship_icons.py
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ship-icons-v3/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate lightweight ship WebP icons [skip ci]"
            git push
          fi
