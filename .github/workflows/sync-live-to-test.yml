name: Sync LIVE to TEST (manual)
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-to-test-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout LIVE repository (read-only)
        uses: actions/checkout@v4
        with:
          repository: Cimera311/Wahuelapa-Universe
          ref: main
          path: live-source
          persist-credentials: false

      - name: Copy LIVE files, preserve TEST-only content
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='live-source/' \
            --exclude='test-only/' \
            --exclude='TESTSERVER.md' \
            --exclude='src/cloud-config.js' \
            "live-source/" ./
          rm -rf live-source
          # Explicit test-only overrides are applied after each sync.
          if [ -d test-only/overrides ]; then
            cp -a test-only/overrides/. ./
          fi

      - name: Refuse accidental production connection
        shell: bash
        run: |
          set -euo pipefail
          test -f src/cloud-config.js
          if grep -q 'qavlbxbkhahjbpgcmazd.supabase.co' src/cloud-config.js; then
            echo "::error::TEST still points to LIVE Supabase. Configure an isolated TEST Supabase first."
            exit 1
          fi
          if grep -q 'cimera311.github.io/Wahuelapa-Universe/' src/cloud-config.js; then
            echo "::error::TEST redirectUrl still points to LIVE site."
            exit 1
          fi

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test and build
        run: |
          npm ci
          npm test
          node --test test-only/*.test.mjs
          npm run build

      - name: Record and publish sync commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already in sync; no changes to commit."
            exit 0
          fi
          git commit -m "chore(test): sync from LIVE main"
          git push origin HEAD:main

      - name: Include standalone planet preview in TEST Pages
        run: |
          mkdir -p dist/preview
          cp test-only/PlanetScenePreview.html dist/preview/planet-scene.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy TEST site
        id: deployment
        uses: actions/deploy-pages@v4

