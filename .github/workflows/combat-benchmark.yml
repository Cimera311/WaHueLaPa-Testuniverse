name: Combat v3/v4/v5/v6 benchmark

on:
  workflow_dispatch:
    inputs:
      comparison:
        description: 'Engine comparison'
        required: true
        default: 'v4-v5'
        type: choice
        options:
          - v4-v5
          - v3-v4
          - v5-v6
      realm:
        description: 'Realm balance profile for v6'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - test
          - test2
          - test4
      scenario:
        description: 'Scenario'
        required: true
        default: 'duel'
        type: choice
        options:
          - swarm
          - duel
          - mid
          - orbital
          - large
          - stress
          - falke_titan
          - titan_falke
          - waechter_falke
          - waechter_titan
          - donner_flak
          - donner_laser
          - donner_orbital
          - mixed_special
          - special
          - all
      runs:
        description: 'Number of seeds (1-1000); large scenarios capped at 3'
        required: true
        default: '10'
        type: string
  pull_request:
    paths:
      - 'src/combat-hybrid.js'
      - 'src/realm-config.js'
      - 'tests/combat-v6.test.js'
      - 'tests/combat-v5.test.js'
      - 'scripts/combat-benchmark.mjs'
      - '.github/workflows/combat-benchmark.yml'

permissions:
  contents: read

jobs:
  combat-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPARE: ${{ github.event.inputs.comparison || 'v4-v5' }}
      REALM: ${{ github.event.inputs.realm || 'main' }}
      SCENARIO: ${{ github.event.inputs.scenario || 'swarm' }}
      RUNS: ${{ github.event.inputs.runs || '3' }}
      V3_MAX_UNITS: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run standard tests
        run: npm test
      - name: Run benchmark
        run: node scripts/combat-benchmark.mjs
      - name: Add benchmark to job summary
        if: always()
        run: |
          if [ -f benchmark-results/report.md ]; then
            cat benchmark-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-benchmark-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: ignore
